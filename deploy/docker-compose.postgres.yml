# PostgreSQL dev stack (Postgres 16 — matches production major)
#
# Bundled dev Postgres (local container):
#   docker compose -f deploy/docker-compose.postgres.yml up -d
#
# External Postgres (managed DB, /opt/infra/postgres, etc.):
#   Skip this compose file. Set DATABASE_URL — see deploy/external-postgres.env.example
#   and docs/POSTGRES.md § External Postgres.

services:
  postgres:
    image: postgres:16-alpine
    container_name: briefr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefr
      POSTGRES_PASSWORD: briefr
      POSTGRES_DB: briefr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - briefr-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefr -d briefr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  briefr-pg-data:
