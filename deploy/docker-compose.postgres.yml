# PostgreSQL + pgvector dev stack (Postgres 16 + vector extension — E1)
#
# Bundled dev Postgres (local container, port 5432):
#   docker compose -f deploy/docker-compose.postgres.yml up -d
#
# Disposable dev/CI Postgres (port 5433 — no conflict with production or compose above):
#   ./scripts/postgres-dev.sh start
#
# External Postgres (managed DB, /opt/infra/postgres, etc.):
#   Skip this compose file. Set DATABASE_URL — see deploy/external-postgres.env.example
#   and docs/POSTGRES.md § External Postgres / § pgvector cutover.
#
# Image must ship the `vector` extension (plain postgres:16-alpine does not).
# Production major is 17 — cut over /opt/infra/postgres to pgvector/pgvector:pg17
# with the E1 feature deploy (backup + same volume); see docs/POSTGRES.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: briefr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: briefr
      POSTGRES_PASSWORD: briefr
      POSTGRES_DB: briefr
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - briefr-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U briefr -d briefr"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  briefr-pg-data:
