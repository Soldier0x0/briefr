server {
    listen 80;
    server_name projectjupiter.in www.projectjupiter.in;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name projectjupiter.in www.projectjupiter.in;

    # SSL — managed by certbot (fill paths after running certbot)
    ssl_certificate     /etc/letsencrypt/live/projectjupiter.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/projectjupiter.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers (nginx layer, in addition to FastAPI middleware)
    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header X-XSS-Protection         "1; mode=block"                 always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hide server version
    server_tokens off;

    # Hashed Vite assets — safe to cache forever (filename changes each build)
    location /assets/ {
        root   /opt/briefr/frontend/dist;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA shell — never cache so deploys always fetch fresh chunk manifest
    location = /index.html {
        root   /opt/briefr/frontend/dist;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # SPA client-side routing — /privacy, /terms, /cve/* all serve index.html
    location / {
        root   /opt/briefr/frontend/dist;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    # API backend proxy
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;
    }

    # Health check shortcut (useful for uptime monitors) — no DB pool required
    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health/live;
    }

    # Block direct access to uvicorn port through nginx
    # (firewall handles this at OS level)
}
