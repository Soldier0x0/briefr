# BRIEFR — HTTP only (LAN / IP access, no TLS)
# Replace 192.168.1.50 with your server IP or use server_name _;

server {
    listen 80;
    listen [::]:80;
    server_name 192.168.1.50 _;

    server_tokens off;

    include /opt/briefr/deploy/nginx-snippet-gzip.conf;

    add_header X-Content-Type-Options   "nosniff"                       always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;

    location /assets/ {
        root   /opt/briefr/frontend/dist;
        include /opt/briefr/deploy/nginx-snippet-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        root   /opt/briefr/frontend/dist;
        include /opt/briefr/deploy/nginx-snippet-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    location / {
        root   /opt/briefr/frontend/dist;
        include /opt/briefr/deploy/nginx-snippet-security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000/api/health/live;
    }
}
