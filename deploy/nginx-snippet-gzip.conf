# Response compression (I2) — additive; safe on existing installs.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript
    text/javascript
    image/svg+xml
    application/xml
    text/xml;
