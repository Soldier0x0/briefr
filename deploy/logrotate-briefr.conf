# Optional BRIEFR application file logs (V1.4 deploy artifact).
#
# Production default: uvicorn logs to systemd journal (see briefr-backend.service).
# Install this only when you redirect backend stdout/stderr to files under
# /var/lib/briefr/logs/ (e.g. container volume or legacy file logging).
#
# Install (Debian/Ubuntu):
#   sudo cp deploy/logrotate-briefr.conf /etc/logrotate.d/briefr
#   sudo chown root:root /etc/logrotate.d/briefr
#   sudo chmod 0644 /etc/logrotate.d/briefr
#
# Verify:
#   sudo logrotate -d /etc/logrotate.d/briefr

/var/lib/briefr/logs/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    create 0640 briefr briefr
}

/var/lib/briefr/backups/logs/*.log {
    weekly
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0640 briefr briefr
}
