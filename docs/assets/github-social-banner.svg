<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" fill="none" role="img" aria-label="BRIEFR GitHub social banner">
  <defs>
    <radialGradient id="ambient" cx="0.18" cy="0.5" r="0.65" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#e85533" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#0a0a08" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#141412" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- 1280x640 GitHub repo social preview -->
  <rect width="1280" height="640" fill="#0a0a08"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.3"/>
  <rect width="1280" height="640" fill="url(#ambient)"/>

  <!-- Decorative art on far right only -->
  <g opacity="0.42">
    <g transform="translate(860, 130)">
      <rect width="190" height="110" rx="5" fill="#111110" stroke="#2a2a25" transform="rotate(-3 95 55)"/>
      <rect x="36" y="28" width="190" height="110" rx="5" fill="#121211" stroke="#2a2a25"/>
      <rect x="40" y="32" width="44" height="5" rx="1" fill="#e85533"/>
      <rect x="40" y="44" width="90" height="3" rx="1" fill="#333330"/>
      <rect x="40" y="52" width="130" height="3" rx="1" fill="#2a2a25"/>
    </g>
    <g transform="translate(1020, 275)">
      <rect x="20" y="18" width="170" height="95" rx="5" fill="#121211" stroke="#2a2a25"/>
      <rect x="24" y="22" width="32" height="5" rx="1" fill="#d4860a"/>
      <rect x="24" y="34" width="80" height="3" rx="1" fill="#333330"/>
      <rect x="24" y="42" width="110" height="3" rx="1" fill="#2a2a25"/>
    </g>
    <g transform="translate(920, 430)">
      <rect width="200" height="95" rx="5" fill="#121211" stroke="#2a2a25"/>
      <rect x="4" y="4" width="48" height="5" rx="1" fill="#4a9e6a"/>
      <rect x="4" y="16" width="100" height="3" rx="1" fill="#333330"/>
      <circle cx="172" cy="70" r="2.5" fill="#e85533" opacity="0.7"/>
    </g>
  </g>

  <!-- Copy left zone -->
  <g>
    <g transform="translate(88, 228) scale(2)">
      <path d="M11 13v22M16 13v22" stroke="#3d3d38" stroke-width="2" stroke-linecap="round"/>
      <rect x="22" y="14" width="22" height="3" rx="1" fill="#e85533"/>
      <rect x="22" y="22" width="15" height="2.5" rx="1" fill="#f2f0ea" opacity="0.75"/>
      <rect x="22" y="29" width="10" height="2.5" rx="1" fill="#a7a396" opacity="0.55"/>
    </g>
    <text x="200" y="310" font-family="'DM Serif Display', Georgia, serif" font-size="84" fill="#f2f0ea">BRIEFR</text>
    <text x="204" y="358" font-family="'IBM Plex Mono', monospace" font-size="14" fill="#a7a396" letter-spacing="0.22em">CVE INTELLIGENCE</text>
    <rect x="204" y="374" width="64" height="2.5" rx="1" fill="#e85533"/>
  </g>
</svg>
