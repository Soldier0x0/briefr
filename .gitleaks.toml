title = "BRIEFR gitleaks"

[extend]
useDefault = true

[allowlist]
description = "Placeholders, fixtures, and CI/test-only secrets (not production credentials)"
paths = [
  '''(?:^|/)backend/\.env\.example$''',
  '''(?:^|/)backend/tests/''',
]
regexes = [
  '''your_[a-z_]+_here''',
  '''your_key_here''',
  '''generate_a_long_random_secret_here''',
  '''ci-test-jwt-secret-not-for-production''',
  '''playwright-smoke-test-jwt-secret-32b''',
  '''smoke-test-password-32bytes!!''',
  '''super_secret_value''',
  '''sk-1234567890abcdef''',
  # max_age_hours=24 * 365 and similar TTL math — not API keys (composer.py false positive)
  '''max_age_hours=\d+ \* \d+''',
]
commits = [
  # Historical false positives on exploit TTL expression (pre-constant refactor)
  "fbb28d8f1275b65300917640d644385f4d78b127",
  "99e1457b0e74120a4ba37d956a3822bb910eca34",
]
