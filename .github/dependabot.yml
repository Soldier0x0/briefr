# Keep production dependencies patched before npm/pip audit CI fails.
# https://docs.github.com/en/code-security/dependabot
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # eslint-plugin-react@latest peer range excludes eslint 10 (^3–^9.7 only).
    # Remove this ignore once eslint-plugin-react adds eslint 10 support.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
    groups:
      frontend-runtime:
        patterns:
          - "*"
        exclude-patterns:
          - vite
          - "@vitejs/*"
          - playwright
      frontend-tooling:
        patterns:
          - vite
          - "@vitejs/*"
          - playwright

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
