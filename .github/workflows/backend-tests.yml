name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted action runners are migrating off Node 20 (deprecated mid-2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run pytest
        run: cd backend && pytest tests/ -q

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: briefr
          POSTGRES_PASSWORD: briefr
          POSTGRES_DB: briefr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://briefr:briefr@127.0.0.1:5432/briefr
      BRIEFR_REQUIRE_POSTGRES: "1"
      JWT_SECRET: ci-test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run Postgres pool integration tests
        run: cd backend && pytest tests/test_postgres_pool.py -q

      - name: Intel snapshot export round-trip smoke
        run: cd backend && pytest tests/test_intel_snapshot_export.py -q

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit npm dependencies (high+)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run audit:ci

  playwright-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt
          playwright install chromium --with-deps

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run Playwright smoke (pytest)
        env:
          PLAYWRIGHT_SMOKE: "1"
        run: cd backend && pytest tests/test_playwright_smoke.py -q
