name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# GitHub-hosted action runners are migrating off Node 20 (deprecated mid-2026).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-postgres:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: briefr
          POSTGRES_PASSWORD: briefr
          POSTGRES_DB: briefr
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://briefr:briefr@127.0.0.1:5432/briefr
      BRIEFR_REQUIRE_POSTGRES: "1"
      JWT_SECRET: ci-test-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Install PostgreSQL client tools
        run: |
          for attempt in 1 2 3; do
            if timeout 180 sudo apt-get update -qq -o Acquire::Retries=3 \
              && timeout 180 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends postgresql-client; then
              pg_dump --version
              exit 0
            fi
            echo "apt-get attempt ${attempt} failed; retrying in 15s..."
            sleep 15
          done
          echo "apt-get failed after 3 attempts"
          exit 1

      - name: Ruff check (F,E9,B)
        run: cd backend && ruff check --select F,E9,B .

      - name: Postgres backup round-trip smoke (Post-B4)
        run: cd backend && pytest tests/test_backup_roundtrip_postgres.py -q

      - name: Run full suite against Postgres
        run: cd backend && pytest tests/ -q

  frontend:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Production build
        working-directory: frontend
        run: npm run build

      - name: ESLint (scoring + admin)
        working-directory: frontend
        run: npm run lint

      - name: Unit tests
        working-directory: frontend
        run: npm run test:unit

      - name: Design-token lint
        run: ./scripts/lint-design-tokens.sh

  dependency-audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit Python dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Audit npm dependencies (high+)
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          # registry.npmjs.org /-/npm/v1/security/advisories/bulk 503s are
          # transient; npm ci already reported 0 vulns before audit:ci.
          for attempt in 1 2 3 4; do
            if npm run audit:ci; then
              exit 0
            fi
            echo "npm audit failed (attempt ${attempt}); retrying..."
            sleep $((attempt * 20))
          done
          npm run audit:ci

  playwright-smoke:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-1.62.0

      - name: Install Chromium for Playwright
        run: playwright install chromium --with-deps

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Run Playwright smoke (pytest)
        env:
          PLAYWRIGHT_SMOKE: "1"
        run: cd backend && timeout 540 pytest tests/test_playwright_smoke.py -q --timeout=180
