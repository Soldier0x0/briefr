<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const t=localStorage.getItem('briefr_theme');
      if(t) document.documentElement.setAttribute('data-theme',t);
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP: 'unsafe-inline' in style-src is required for Vite dev mode,
         which injects CSS via inline <style> elements from JS modules.
         In production (nginx + built bundle), replace with a nonce-based policy. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' http://localhost:8000 http://192.168.1.50:8000" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&family=DM+Serif+Display:ital@0;1&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
    <!-- Apply saved theme before React renders to prevent flash -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('briefr_theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
          }
        } catch (_) {}
      })()
    </script>
    <title>BRIEFR | CVE Intelligence</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%230a0a08'/><text x='4' y='24' font-family='monospace' font-size='20' fill='%23e85533'>B</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
