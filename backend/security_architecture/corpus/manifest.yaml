notes: >
  TM-1 (corpus generator + loader + drift CI) seeded curated sections as
  intentionally empty placeholders. TM-3 (MITRE ATT&CK + Threat Scenarios +
  Controls + Self-exposure) did the first real security-review pass over
  `controls.yaml`. TM-4 (System Architecture graph + Trust Boundaries +
  Attack Surface) added `graphs/architecture.json` (generated -- component/
  job/table nodes, component->table SQL-reference edges), a real curated
  pass over `trust_boundaries.yaml` (2 boundaries, spec §5.3 examples), and
  a read-time attack-surface merge (generated api_inventory × curated
  controls.related_apis, counts only -- security_architecture/graphs.py).
  TM-5 (Risk Register + Decisions + Review History + Abuse Cases + Search)
  seeded `security_decisions.yaml` from the two real ADRs in docs/decisions/,
  `abuse_cases.yaml` with six entries each backed by real protection code
  (webhook SSRF, webhook replay, rate-limit bypass, SQL injection, log
  secret leakage, and one honestly-open broken-authorization finding), and
  `reviews.yaml` with the program's own TM-3/TM-4/TM-5 curated review
  passes. `risks.yaml` stays intentionally empty -- no real risk-register
  judgment pass has happened yet; the register's live rows (self-stack KEV
  hits, `origin: live`) are the only non-empty content there today, computed
  at read time. TM-5 also added the staleness-decay `stale` flag on every
  curated row (security_architecture/merge.py::annotate_stale) and turned
  the Overview "Controls" tile into the spec §5.1 "Controls Active" ratio
  (active/total, stale controls excluded from both sides).
  `mitre_attack` has no corpus file of its own: it's served
  entirely from live `mitre_techniques`/`cve_technique_map` DB data via
  GET /api/security-architecture/mitre (routers.forge.build_coverage_map,
  reused not duplicated). The generated layer (components, api_inventory,
  scheduler_jobs, db_tables, self_stack, graphs/architecture.json) is real
  and machine-derived; see corpus_loader.py, graphs.py, and
  scripts/generate_security_corpus.py.

  TM-6 (framework workspaces) added four analyst-facing sections with no
  corpus file of their own -- cwe, owasp, capec, stride. Like mitre_attack
  they are served entirely from live DB data: the user's own threat surface
  (ingested `cves.cwe_ids`, scoped to All / My Stack / Watchlist / KEV via
  GET /api/security-architecture/frameworks/{id}). OWASP/CAPEC/STRIDE are
  projections of the same live CWE aggregation through published reference
  mappings (security_architecture/frameworks/reference.py); CWEs with no
  mapping are reported in an explicit `unmapped` bucket so the totals
  reconcile. This is the spec §4.5 reframe: frameworks point at the user's
  data, not BRIEFR's self-stack (which stays operator/self-monitoring scope).

  Note on spec §2.2's navigation catalog: that table uses kebab-case
  section ids (`system-architecture`, `trust-boundaries`, `attack-surface`).
  Code has used snake_case since TM-1 (`mitre_attack`, `trust_boundaries`,
  `security_decisions`, ...) -- this file follows the established code
  convention, not the spec table verbatim; the spec table is stale on this
  point and should be read as descriptive of intent, not literal ids.
