[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    playwright_smoke: Chromium UI smoke against seeded stack (PLAYWRIGHT_SMOKE=1 only)
    no_auth: skip autouse TestClient session cookie (unauthenticated API tests)
    postgres_migrations: requires DATABASE_URL=postgresql:// (Procrastinate / dual-DB)
